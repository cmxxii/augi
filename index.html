<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>augi</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+US+Modern:wght@100..400&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,ROND@0..1,100&icon_names=dine_lamp,directions_car,assignment,sort,history,task_alt,event,edit_square,hourglass_empty,label_important,problem,add_circle,delete,door_open,home_storage,nest_multi_room,bed,chair,kitchen,table_restaurant,garage_door,household_supplies,hallway,faucet,stairs,shopping_basket&display=block" rel="stylesheet" />
</head>
<body>

  <!-- LOGIN SCREEN — shown when not logged in, hidden once you are -->
  <div id="login-screen">
    <div id="login-card">
      <h1>augi</h1>
      <p>Sign in to access household hub.</p>

      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email address" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit" class="btn-primary">Sign in</button>
        <p id="login-error" class="error-msg hidden"></p>
      </form>
    </div>
  </div>

  <!-- MAIN APP — hidden until logged in -->
  <div id="app" class="hidden">
    <header class="top-bar">
      <h1 id="home-link">augi</h1>
      <div class="who-am-i">
        <span id="logged-in-name"></span>
        <button id="show-feedback" class="btn-text">sos</button>
      </div>
    </header>

    <div id="feedback-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3>Send feedback</h3>
        <textarea id="feedback-message" placeholder="Bug, idea, complaint — whatever's on your mind" rows="4" required></textarea>
        <div class="form-buttons">
          <button id="submit-feedback" class="btn-primary">Send</button>
          <button id="cancel-feedback" class="btn-text">Cancel</button>
        </div>
      </div>
    </div>
    

    <nav class="tabs">
      <button class="tab-button active" data-tab="chores-tab">Chores</button>
      <button class="tab-button" data-tab="inventory-tab">Inventory</button>
      <button class="tab-button" data-tab="groceries-tab">Groceries</button>
    </nav>

    <!-- CHORES TAB -->
    <main id="chores-tab" class="tab-panel active">
      <div class="panel-header">
        <h2>Chores</h2>
        <div class="header-buttons">
          <label class="toggle-switch">
            Edit:
            <input type="checkbox" id="toggle-chore-edit-mode" />
            <span class="toggle-slider"></span>
          </label>
          <button id="show-add-chore" class="btn-secondary">+ Add chore</button>
        </div>
      </div>
      <form id="add-chore-form" class="add-form hidden">
        <input type="text" id="chore-name" placeholder="Chore name (e.g. Sweep and vacuum)" required />
        <select id="chore-room">
          <option value="">Room</option>
        </select>
        <input type="number" id="chore-interval-days" placeholder="Frequency in days (e.g. enter 7 for once-a-week)" min="1" />
        <div class="form-buttons">
          <button type="submit" class="btn-primary">Save chore</button>
          <button type="button" id="cancel-add-chore" class="btn-text">Cancel</button>
        </div>
      </form>
            <div class="subtab-nav">
        <button class="subtab-button active" data-subtab="chores-todo-subtab">To-do</button>
        <button class="subtab-button" data-subtab="chores-history-subtab">History</button>
      </div>

      <div id="chores-todo-subtab" class="subtab-panel active">
        <div class="sort-toggle">Sort by: 
          <button class="sort-btn active" data-sort="priority">Priority</button>
          <button class="sort-btn" data-sort="room">Room</button>
        </div>
        <div id="chores-list" class="list"></div>
      </div>

      <div id="chores-history-subtab" class="subtab-panel">
        <div class="filters">
          <select id="history-room-filter">
            <option value="">All rooms</option>
          </select>
        </div>
        <div id="history-list" class="list"></div>
      </div>
    </main>

    <!-- INVENTORY TAB -->
    <main id="inventory-tab" class="tab-panel">
      <div class="panel-header">
        <h2>Inventory</h2>
        <button id="show-add-item" class="btn-secondary">+ Add item</button>
      </div>
      <form id="add-item-form" class="add-form hidden">
        <input type="text" id="item-name" placeholder="Item name (e.g. Trash bags)" required />
        <input type="text" id="item-category" placeholder="Category (optional, e.g. Cleaning)" />
        <div class="form-buttons">
          <button type="submit" class="btn-primary">Save item</button>
          <button type="button" id="cancel-add-item" class="btn-text">Cancel</button>
        </div>
      </form>
      <div id="inventory-list" class="list"></div>
    </main>

    <!-- GROCERIES TAB -->
    <main id="groceries-tab" class="tab-panel">
      <div class="panel-header">
        <h2>Groceries</h2>
        <div class="header-buttons">
          <label class="toggle-switch">
            Edit:
            <input type="checkbox" id="toggle-grocery-edit-mode" />
            <span class="toggle-slider"></span>
          </label>
          <button id="show-add-grocery" class="btn-secondary">+ Add request</button>
        </div>
      </div>
      <form id="add-grocery-form" class="add-form hidden">
        <input type="text" id="grocery-item" placeholder="Item (e.g. Pretzels)" required />
        <input type="text" id="grocery-note" placeholder="Note (optional, e.g. Snyder's honey mustard)" />
        <div class="form-buttons">
          <button type="submit" class="btn-primary">Add to list</button>
          <button type="button" id="cancel-add-grocery" class="btn-text">Cancel</button>
        </div>
      </form>
      <div id="groceries-list" class="list"></div>
      <details id="purchased-details">
        <summary>Past items</summary>
        <div id="purchased-list" class="list"></div>
      </details>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
