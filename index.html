<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>augi</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+ES:wght@100..400&family=Playwrite+PE:wght@100..400&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=hourglass,person_celebrate,person_add,emoji_people,language,takeout_dining,grocery,nutrition,shelves,heart_smile,house,family_group,close,face,face_2,face_3,face_4,arrow_back,dine_lamp,directions_car,assignment,sort,history,task_alt,event,edit_square,hourglass_empty,label_important,problem,add_circle,delete,door_open,home_storage,nest_multi_room,bed,chair,kitchen,table_restaurant,garage_door,household_supplies,hallway,faucet,stairs,shopping_basket&display=block" />
</head>
<body>

  <!-- LOGIN SCREEN — shown when not logged in, hidden once you are -->
  <div id="login-screen">
    <div id="login-card">
      <h1>augi</h1>
      <p>Sign in to access household hub.</p>

      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email address" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit" class="btn-primary">Sign in</button>
        <p id="login-error" class="error-msg hidden"></p>
      </form>
    </div>
  </div>

  <!-- MAIN APP — hidden until logged in -->
  <div id="app" class="hidden">
    <header class="top-bar">
      <div class="brand">
        <h1 id="home-link">augi</h1>
        <button id="show-version" class="version-button"></button>
      </div>
      <div class="top-bar-actions">
        <nav class="tabs">
          <button class="tab-button icon-button active" data-tab="chores-tab" title="Chores"><span class="material-symbols-rounded">nest_multi_room</span></button>
          <button class="tab-button icon-button" data-tab="groceries-tab" title="Pantry"><span class="material-symbols-rounded">nutrition</span></button>
        </nav>
      </div>

       <div class="who-am-i">
        <button id="logged-in-name" class="user-button"></button>
      </div>
    </header>

    <div id="my-chores-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="my-chores-title">My chores</h3>
          <button id="close-my-chores" class="btn-text modal-close"><span class="material-symbols-rounded">close</span></button>
        </div>
        <div id="my-chores-list" class="list"></div>
        <div class="modal-actions">
          <button id="secret-pantry" class="btn-text hidden"><span class="material-symbols-rounded">kitchen</span> Pantry</button>
        </div>
      </div>
    </div>

    <div id="version-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="version-modal-title">What's new</h3>
          <button id="close-version" class="btn-text modal-close"><span class="material-symbols-rounded">close</span></button>
        </div>

        <div id="version-notes" class="version-notes"></div>
        

        <div class="modal-actions">
          <button id="show-feedback" class="btn-text"><span class="material-symbols-rounded">problem</span> Feedback</button>
        </div>
      </div>
    </div>

    <div id="feedback-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3>Have an idea? Found a bug?</h3>
        <textarea id="feedback-message" placeholder="Share feedback" rows="3" required></textarea>
        <div class="form-buttons">
          <button id="submit-feedback" class="btn-primary">Send</button>
          <button id="cancel-feedback" class="btn-text">Cancel</button>
        </div>
      </div>
    </div>

 <!-- CHORES TAB -->
    <main id="chores-tab" class="tab-panel active" data-subtab="chores-todo-subtab">
      <div class="panel-header">
        <h2>Chores</h2>
        <div id="chore-stats" class="panel-stats"></div>
      </div>
      <div class="subtab-nav">
        <button class="subtab-button active" data-subtab="chores-todo-subtab"><span class="material-symbols-rounded">assignment</span> Tasks</button>
        <button class="subtab-button" data-subtab="chores-history-subtab"><span class="material-symbols-rounded">history</span> History</button>
        <button class="subtab-button" data-subtab="chores-supplies-subtab"><span class="material-symbols-rounded">household_supplies</span> Supplies</button>
      </div>

      <div class="sort-toggle">
        <div class="sort-toggle-buttons">
          <button class="sort-btn active" data-sort="room">Rooms</button>
          <button class="sort-btn" data-sort="priority">All Tasks</button>
        </div>
        <div id="chore-manage-wrap" class="header-buttons hidden">
          <label class="toggle-switch">
            Manage:
            <input type="checkbox" id="toggle-chore-manage-mode" />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div id="supply-manage-wrap" class="header-buttons hidden">
          <label class="toggle-switch">
            Manage:
            <input type="checkbox" id="toggle-supply-manage-mode" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>


      <div id="chores-todo-subtab" class="subtab-panel active">
        
        <form id="add-chore-form" class="add-form hidden">
          <div class="field-with-icon">
            <span class="material-symbols-rounded field-icon">assignment</span>
            <input type="text" id="chore-name" placeholder="Chore name (e.g. Sweep and vacuum)" required />
          </div>
          <div class="field-with-icon">
            <span class="material-symbols-rounded field-icon">nest_multi_room</span>
            <select id="chore-room" required>
              <option value="">Select a room</option>
            </select>
          </div>
          <div class="field-with-icon">
            <span class="material-symbols-rounded field-icon">event</span>
            <input type="number" id="chore-interval-days" placeholder="Frequency in days (e.g. enter 7 for once-a-week)" min="1" />
          </div>
          <div id="chore-assignees" class="assignee-toggles"></div>
          <div class="form-buttons">
            <button type="submit" class="btn-primary">Save chore</button>
            <button type="button" id="cancel-add-chore" class="btn-text">Cancel</button>
          </div>
        </form>
        <div id="chores-list" class="list"></div>
      </div>

      <div id="chores-history-subtab" class="subtab-panel">
        <div id="history-list" class="list"></div>
      </div>

      <div id="chores-supplies-subtab" class="subtab-panel">
        
        <form id="add-item-form" class="add-form hidden">
          <input type="text" id="item-name" placeholder="Item name (e.g. Trash bags)" required />
          <input type="text" id="item-category" placeholder="Category (optional, e.g. Cleaning)" />
          <div id="item-rooms-wrap"></div>
          <div class="form-buttons">
            <button type="submit" class="btn-primary">Save item</button>
            <button type="button" id="cancel-add-item" class="btn-text">Cancel</button>
          </div>
        </form>
        <div id="inventory-list" class="list"></div>
      </div>
    </main>

    <!-- GROCERIES TAB -->
    <main id="groceries-tab" class="tab-panel">
      <div class="panel-header">
        <h2>Groceries</h2>
        <div class="header-buttons">
          <label class="toggle-switch">
            Edit:
            <input type="checkbox" id="toggle-grocery-edit-mode" />
            <span class="toggle-slider"></span>
          </label>
          <button id="show-add-grocery" class="btn-secondary">+ Add request</button>
        </div>
      </div>
      <form id="add-grocery-form" class="add-form hidden">
        <input type="text" id="grocery-item" placeholder="Item (e.g. Pretzels)" required />
        <input type="text" id="grocery-note" placeholder="Note (optional, e.g. Snyder's honey mustard)" />
        <div class="form-buttons">
          <button type="submit" class="btn-primary">Add to list</button>
          <button type="button" id="cancel-add-grocery" class="btn-text">Cancel</button>
        </div>
      </form>
      <div id="groceries-list" class="list"></div>
      <details id="purchased-details">
        <summary>Past items</summary>
        <div id="purchased-list" class="list"></div>
      </details>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
